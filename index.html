<!doctype html>
<html lang="pt-BR" class="dark bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Android / Chrome / WebView Status Bar & Navigation Bar Colors -->
    <meta name="theme-color" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#020617" />
    <meta name="color-scheme" content="dark" />
    
    <!-- WebApp & Android APK Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-navbutton-color" content="#020617" />
    <meta name="msapplication-TileColor" content="#020617" />
    
    <!-- iOS Status Bar & Safe Area -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartFinancer" />
    
    <!-- Web App Manifest for APK and PWA wrappers -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logosmartfincancer.png" />
    
    <title>SmartFinancer - Controle Financeiro Inteligente</title>
    <!-- Initial Theme Initialization to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('smartfinancer_theme_mode') || 'system';
          var isDark = true;
          if (mode === 'light') {
            isDark = false;
          } else if (mode === 'dark') {
            isDark = true;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Ensure clean background without white flashes */
      html.dark, html.dark body, html.dark #root {
        background-color: #020617 !important;
        color: #f8fafc;
      }
      html.light, html.light body, html.light #root {
        background-color: #f8fafc !important;
        color: #0f172a;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
